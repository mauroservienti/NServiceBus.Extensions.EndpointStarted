name: CI
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
    branches:
      - master
      - release-*
  pull_request:
  workflow_dispatch:
env:
  DOTNET_NOLOGO: true
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
jobs:
  build:
    name: Build and test on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            10.0.x
      - name: Build
        run: dotnet build src --configuration Release
      - name: Tests
        run: dotnet test src --configuration Release --no-build
      - name: Upload packages
        if: matrix.name == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nuget-packages
          path: nugets/
          retention-days: 2
  release:
    needs: build
    name: Release
    if: startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: nuget-packages
          path: nugets/
      - name: Check tag type
        id: check-tag-type
        run: |
          if [[ "${{ github.ref_name }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release-type=production" >> $GITHUB_OUTPUT
          else
            echo "release-type=pre-release" >> $GITHUB_OUTPUT
          fi
      - name: Push pre-release package to Feedz.io
        if: steps.check-tag-type.outputs.release-type == 'pre-release'
        run: dotnet nuget push ./nugets/*.nupkg --source https://f.feedz.io/mauroservienti/pre-releases/nuget --api-key ${{ secrets.FEEDZ_API_KEY }}
      - name: Push pre-release symbols to Feedz.io
        if: steps.check-tag-type.outputs.release-type == 'pre-release'
        run: dotnet nuget push ./nugets/*.snupkg --source https://f.feedz.io/mauroservienti/pre-releases/symbols --api-key ${{ secrets.FEEDZ_API_KEY }}
      - name: Push production package to NuGet.org
        if: steps.check-tag-type.outputs.release-type == 'production'
        run: dotnet nuget push ./nugets/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
